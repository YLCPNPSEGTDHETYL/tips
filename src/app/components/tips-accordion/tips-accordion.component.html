<div class="tips-accordion" [class.is-open]="isOpen">
	<button class="tips-accordion__header" (click)="toggle()" [attr.aria-expanded]="isOpen">
		<span class="tips-accordion__title">{{ title }}</span>
		<span class="tips-accordion__icon">
			<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
				stroke-linecap="round" stroke-linejoin="round">
				<polyline points="6 9 12 15 18 9"></polyline>
			</svg>
		</span>
	</button>

	<div class="tips-accordion__content" [attr.aria-hidden]="!isOpen">
		<div class="tips-accordion__inner">
			<ng-content></ng-content>
		</div>
	</div>
</div>
